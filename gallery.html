<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="View recent car detailing results from K&F Car Detailing, including interior detailing and paint correction work." />
    <title>Gallery | K&F Car Detailing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="images&videos/kflogo.png" /> <!-- ADD ICON -->
  </head>
  <body>
    <!--
      GALLERY PAGE: gallery.html
      ---------------------------
      Editing guidance:

      - Replace placeholder gallery items with real images:
        <figure class="gallery-item"><img src="images/example.jpg" alt="Description"></figure>
      - Use classes .tall or .wide on <figure> to change layout sizes.
      - The page uses a responsive grid; keep image aspect ratio consistent for best results.
    -->
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="K and F Car Detailing home">
          <img src="images&videos/kflogo.png" alt="K&F Car Detailing logo" />
        </a>

        <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <nav class="site-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="services.html">Services</a>
          <a href="contact.html">Book an Appointment</a>
          <a href="gallery.html">Gallery</a>
          <a href="about.html">About</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container narrow">
          <h1>Results that turn heads and keep vehicles protected.</h1>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="slideshow" aria-label="Detailing work gallery">
            <div class="slideshow-track">
              <figure class="slide">
                <img src="images&videos/foamoncar2.JPEG" alt="Complete vehicle foam wash detailing" />
              </figure>
              <figure class="slide">
                <img src="images&videos/foamonbackcar.JPEG" alt="Foam application on back of car" />
              </figure>
              <figure class="slide">
                <img src="images&videos/cleaningfrontofcar.JPEG" alt="Professional front car cleaning" />
              </figure>
              <figure class="slide">
                <img src="images&videos/foamonbackcar2.JPEG" alt="Foam wash detailing process" />
              </figure>
              <figure class="slide">
                <img src="images&videos/cleaningsideofcar.JPEG" alt="Side car washing and detailing" />
              </figure>
              <figure class="slide">
                <img src="images&videos/foamonbackcar3.JPEG" alt="Foam application technique" />
              </figure>
              <figure class="slide">
                <img src="images&videos/cleaningfrontofcar2.JPEG" alt="Front bumper and hood cleaning" />
              </figure>
              <figure class="slide">
                <img src="images&videos/foamonbackcar4.JPEG" alt="Professional foam wash on vehicle" />
              </figure>
              <figure class="slide">
                <img src="images&videos/cleaningsideofcar2.JPEG" alt="Side panel deep cleaning" />
              </figure>
              <figure class="slide">
                <img src="images&videos/foamonbackcar5.JPEG" alt="Foam detailing application" />
              </figure>
              <figure class="slide">
                <img src="images&videos/cleanngfrontofcar3.JPEG" alt="Professional front exterior cleaning" />
              </figure>
              <figure class="slide">
                <img src="images&videos/foamonbackcar6.JPEG" alt="Foam wash final stage" />
              </figure>
              <figure class="slide">
                <img src="images&videos/foamonbackcar7.JPEG" alt="Complete foam wash detailing result" />
              </figure>
            </div>

            <button type="button" class="slide-arrow slide-prev" aria-label="Previous image">←</button>
            <button type="button" class="slide-arrow slide-next" aria-label="Next image">→</button>

            <div class="slide-dots" role="tablist" aria-label="Choose slide"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© <span id="year"></span> K&F Car Detailing</p>
        <div class="footer-links">
          <a href="services.html">Services</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
